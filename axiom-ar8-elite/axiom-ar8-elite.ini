[MESA]
VERSION = 2.1.8
BOARD = 7i95
BOARD_NAME = 7i95T
FIRMWARE = ./mesa-firmware/7i95t_1v3pkt.bin

[EMC]
VERSION = 1.1
MACHINE = Axiom AR8 Elite
DEBUG = 0x00000000

[HM2]
DRIVER = hm2_eth
ADDRESS = 192.168.1.121

[DISPLAY]
DISPLAY = axis
EDITOR = geany
PROGRAM_PREFIX = /media/nas/files/Haskins Guitars/gcode
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = COMMANDED
MAX_FEED_OVERRIDE = 1.2
MIN_LINEAR_VELOCITY = 0.0
DEFAULT_LINEAR_VELOCITY = 25
MAX_LINEAR_VELOCITY = 50.0
CYCLE_TIME = 0.1
INTRO_GRAPHIC = emc2.gif
INTRO_TIME = 0
OPEN_FILE = ""
INCREMENTS = continuous, 10 mm, 1.0 mm, 0.10 mm, 0.01 mm
SPINDLE_INCREMENT = 1000
DEFAULT_SPINDLE_0_SPEED = 15000
MIN_SPINDLE_0_SPEED = 2000
MAX_SPINDLE_0_SPEED = 24000

EMBED_TAB_NAME    = Spindle
EMBED_TAB_COMMAND = pyvcp z-probe-puck/pyvcp/ztouch.xml

[ZPUCK]
PUCK_THICKNESS = 25

SEARCH_FEED = 25
SEARCH_DISTANCE = -10

LATCH_FEED = 5
LATCH_BACKOFF = 0.5
LATCH_DISTANCE = -1

; Distance to raise after latch probe
FIANL_BACKOFF = 50

[RAPIDCHANGEATC]
NUM_POCKETS = 8

POCKET_BASE_X = 583
POCKET_BASE_Y = 99.5
POCKET_OFFSET_X = 0
POCKET_OFFSET_Y = 45

SAFE_Z = 195

ENGAGE_RPM = 1500
ENGAGE_Z_START = 85
ENGAGE_Z_END = 55
ENGAGE_Z_FEED = 2000

# -1 disables IR
IR_DI = -1

TOOLSET_X = 582.5
TOOLSET_Y = 55

TOOLSET_SEARCH_FEED = 200
TOOLSET_SEARCH_DISTANCE = -100
TOOLSET_LATCH_BACKOFF = 1
TOOLSET_LATCH_DISTANCE = -1.5
TOOLSET_LATCH_FEED = 10
TOOLSET_HEIGHT = 83

MANUAL_CHANGE_X = 582.5
MANUAL_CHANGE_Y = 0

[PROBE]
USE_PROBE = versaprobe

[HALUI]
MDI_COMMAND = O<probe_z_puck> CALL

[KINS]
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[EMCIO]
EMCIO = iov2
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[PYTHON]
TOPLEVEL = python/toplevel.py
PATH_PREPEND = ./python
PATH_PREPEND = ./rapidchange
PATH_APPEND = ~/linuxcnc/nc_files/examples/remap_lib/python-stdglue

[RS274NGC]
PARAMETER_FILE = parameters.var
REMAP=M6    modalgroup=6 prolog=rapidchange_change_prolog ngc=rapidchange_m6 epilog=change_epilog
SUBROUTINE_PATH = rapidchange/subroutines:z-probe-puck/subroutines
ON_ABORT_COMMAND=o<on_abort> call

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[TRAJ]
COORDINATES = XYZ
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 150.0
NO_FORCE_HOMING = 1

[HAL]
HALUI = halui
TWOPASS = on
HALFILE = hal/main.hal
HALFILE = hal/servos-xyz.hal
HALFILE = hal/spindle.hal
HALFILE = hal/z-probe.hal
HALFILE = hal/tool-change.hal
POSTGUI_HALFILE = hal/post-gui.hal

